
name: Publicar portafolio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build -- --base-href=/portfolio-xady/

      - name: Preparar rutas
        run: cp dist/portfolio-xady/browser/index.html dist/portfolio-xady/browser/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/portfolio-xady/browser

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
