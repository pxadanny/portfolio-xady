<div class="bg-brand-olive px-6 py-24 text-brand-cream sm:px-10 lg:px-12 lg:py-32">
  <div class="mx-auto max-w-7xl">
    <div class="mb-14 grid items-end gap-6 lg:grid-cols-2">
      <div>
        <p class="mb-5 text-xs font-semibold uppercase tracking-[0.28em] text-[#E4C697]">03 / Herramientas</p>
        <h2 class="font-editorial text-6xl leading-[0.95] sm:text-7xl">
          Ideas respaldadas por <em class="font-display text-[#E4C697]">tecnología.</em>
        </h2>
      </div>
      <p class="max-w-xl text-base leading-8 text-brand-cream/80 lg:ml-auto">
        Estas son las tecnologías y herramientas que forman parte de mi trabajo.
        Me ayudan a convertir conceptos en experiencias digitales funcionales.
      </p>
    </div>
    <div class="grid gap-7 md:grid-cols-2">
      <div *ngFor="let category of skillCategories" class="rounded-2xl border border-brand-cream/25 bg-brand-cream/5 p-7 sm:p-8">
        <div class="mb-6 flex items-center gap-3">
          <span aria-hidden="true" class="h-px w-8 bg-brand-gold"></span>
          <h3 class="font-editorial text-3xl text-brand-cream">{{category.titulo}}</h3>
        </div>
        <div class="flex flex-wrap gap-3">
          <div *ngFor="let skill of category.skills" class="flex items-center gap-2 rounded-full border border-brand-cream/25 bg-brand-dark/10 px-3 py-2 text-sm text-brand-cream transition hover:border-brand-gold">
            <img [src]="skill.icon" [alt]="skill.titulo" loading="lazy" class="h-6 w-6 object-contain" />
            <span>{{skill.titulo}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
