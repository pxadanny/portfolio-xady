<div class=" flex justify-center items-start lg:items-center bg-brand-soft px-6 pt-25 pb-5 lg:py-20">
  <div class="w-full max-w-[70%]  flex flex-col gap-12">

    <h1 class="text-start text-brand-dark font-black text-3xl sm:text-4xl lg:text-5xl">Stack Tecnológico</h1>
    <p class="text-gray-900 text-base sm:text-lg lg:text-xl font-semibold  mx-auto md:mx-0">Herramientas y lenguajes que domino para dar vida a tus ideas.</p>

    <div class="w-full grid md:grid-cols-5 gap-12 items-stretch">

      <div *ngFor="let skill of skills" class="bg-brand-/90 p-6 rounded-md border border-brand-accent flex flex-col gap-5 items-center">
        <img width="50" height="50" src="{{skill.icon}}"/>
        <p>{{skill.titulo}}</p>
      
      </div>

    </div>
  </div>
</div>
