<div class="flex justify-center bg-brand-soft/60 px-6 py-20">

  <div class="w-full max-w-6xl flex flex-col gap-16">

    <!-- TITULO -->
    <div class="flex flex-col gap-4">
      <h1 class="text-brand-dark text-4xl sm:text-5xl font-black">
        Stack Tecnológico
      </h1>

      <p class="text-gray-800 text-lg sm:text-xl font-medium max-w-2xl">
        Herramientas y lenguajes que utilizo para crear interfaces modernas,
        funcionales y centradas en la experiencia del usuario.
      </p>
    </div>

    <!-- CATEGORIAS -->
    <div *ngFor="let category of skillCategories" class="flex flex-col gap-8">

      <!-- TITULO CATEGORIA -->
      <div class="flex items-center gap-4">
        <div class="h-[2px] w-8 bg-brand-accent"></div>
        <h2 class="text-2xl font-bold text-brand-primary">
          {{category.titulo}}
        </h2>
      </div>

      <!-- GRID SKILLS -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">

        <div
          *ngFor="let skill of category.skills"
          class="group bg-white/40 backdrop-blur-sm p-6 rounded-xl border border-brand-soft/60
                 flex flex-col items-center gap-4
                 transition duration-300
                 hover:shadow-xl hover:-translate-y-1 hover:border-brand-accent">

          <img
            [src]="skill.icon"
            class="w-12 h-12 transition duration-300 group-hover:scale-110"
          >

          <p class="text-sm font-semibold text-brand-dark text-center">
            {{skill.titulo}}
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
