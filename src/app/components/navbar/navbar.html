<header class="fixed inset-x-0 top-0 z-50 border-b border-brand-gold/25 bg-brand-dark/95 text-brand-cream shadow-lg shadow-brand-dark/10 backdrop-blur-xl">
  <nav class="mx-auto flex w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-8 lg:px-12 lg:py-4" aria-label="Navegación principal">
    <a href="#home" (click)="closeMenu()" aria-label="Xadanny, ir al inicio" class="inline-flex min-w-0 items-center gap-2">
      <img src="branding/monograma-dark.svg" alt="" width="42" height="42" class="h-9 w-9 shrink-0 sm:h-10 sm:w-10" />
      <span class="font-editorial text-3xl font-semibold leading-none tracking-[0.04em] text-brand-cream sm:text-4xl">Xadanny<span class="text-brand-gold">.</span></span>
    </a>

    <ul class="hidden items-center gap-5 lg:flex xl:gap-9">
      <li><a href="#services" class="text-sm font-medium tracking-wide text-brand-cream/85 transition-colors hover:text-brand-gold focus-visible:text-brand-gold">Qué hago</a></li>
      <li><a href="#about" class="text-sm font-medium tracking-wide text-brand-cream/85 transition-colors hover:text-brand-gold focus-visible:text-brand-gold">Sobre mí</a></li>
      <li><a href="#habilities" class="text-sm font-medium tracking-wide text-brand-cream/85 transition-colors hover:text-brand-gold focus-visible:text-brand-gold">Habilidades</a></li>
      <li><a href="#contact" class="text-sm font-medium tracking-wide text-brand-cream/85 transition-colors hover:text-brand-gold focus-visible:text-brand-gold">Contacto</a></li>
    </ul>

    <div class="hidden items-center gap-3 lg:flex xl:gap-5">
      <a href="https://github.com/pxadanny" target="_blank" rel="noopener noreferrer"
         aria-label="Ver el GitHub de Xadanny"
         class="inline-flex h-11 w-11 items-center justify-center text-2xl text-brand-cream transition-colors hover:text-brand-gold focus-visible:text-brand-gold">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
      </a>
      <a href="#contact" class="whitespace-nowrap rounded-full border border-brand-gold/70 px-4 py-2.5 text-sm font-semibold text-brand-cream transition-colors hover:bg-brand-gold hover:text-brand-dark focus-visible:bg-brand-gold focus-visible:text-brand-dark xl:px-5">
        Trabajemos juntos <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs" aria-hidden="true"></i>
      </a>
    </div>

    <button type="button" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen" [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
            aria-controls="mobile-menu"
            class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-lg border border-brand-gold/40 text-2xl text-brand-cream transition-colors hover:bg-brand-primary/50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-gold lg:hidden">
      <span aria-hidden="true">{{ menuOpen ? '✕' : '☰' }}</span>
    </button>
  </nav>

  <div *ngIf="menuOpen" id="mobile-menu" class="max-h-[calc(100dvh-4.25rem)] overflow-y-auto border-t border-brand-gold/20 bg-brand-dark px-4 pb-6 pt-3 shadow-xl sm:px-8 lg:hidden">
    <ul class="flex flex-col">
      <li><a href="#services" (click)="closeMenu()" class="block rounded-lg px-3 py-3 text-base font-medium text-brand-cream transition-colors hover:bg-brand-primary/40 hover:text-brand-gold">Qué hago</a></li>
      <li><a href="#about" (click)="closeMenu()" class="block rounded-lg px-3 py-3 text-base font-medium text-brand-cream transition-colors hover:bg-brand-primary/40 hover:text-brand-gold">Sobre mí</a></li>
      <li><a href="#habilities" (click)="closeMenu()" class="block rounded-lg px-3 py-3 text-base font-medium text-brand-cream transition-colors hover:bg-brand-primary/40 hover:text-brand-gold">Habilidades</a></li>
      <li><a href="#contact" (click)="closeMenu()" class="block rounded-lg px-3 py-3 text-base font-medium text-brand-cream transition-colors hover:bg-brand-primary/40 hover:text-brand-gold">Contacto</a></li>
      <li><a href="https://github.com/pxadanny" target="_blank" rel="noopener noreferrer" (click)="closeMenu()" class="block rounded-lg px-3 py-3 text-base font-medium text-brand-gold hover:bg-brand-primary/40">GitHub <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs" aria-hidden="true"></i></a></li>
    </ul>
    <a href="#contact" (click)="closeMenu()" class="mt-4 inline-flex min-h-11 w-full items-center justify-center rounded-full bg-brand-cream px-5 py-3 text-sm font-semibold text-brand-dark transition-colors hover:bg-white">Trabajemos juntos</a>
  </div>
</header>
