<div class=" flex justify-center items-start lg:items-center bg-brand-background px-6 py-5 lg:py-20">
    <div class="w-full max-w-[70%] items-center flex flex-col gap-12 text-justify">
        <h1 class="text-center text-brand-dark font-black text-3xl sm:text-4xl lg:text-5xl">Sobre mí</h1>
        <p class="text-gray-900 text-base sm:text-lg lg:text-xl font-semibold  mx-auto md:mx-0 ">
            Hago realidad tus ideas, transformándolas en interfaces modernas, intuitivas y altamente funcionales,
            siempre priorizando la experiencia del usuario. </p>
        <div  class="w-full  grid md:grid-cols-3 gap-12 items-stretch">
            
            <div *ngFor="let card of cards" class="bg-brand-soft/30 p-6 rounded-md border border-brand-soft flex flex-col gap-5">
                <div class="bg-brand-accent w-fit rounded-md">
                    <i class="fa-solid {{card.icon}} text-white text-2xl m-3"></i>
                </div>
                <p class="font-bold text-brand-accent text-xl">{{card.titulo}}</p>
                <p>{{card.descripcion}}</p>
            </div>  


        </div>

    </div>
</div>
