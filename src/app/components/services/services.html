<div class="relative overflow-hidden bg-brand-cream px-6 py-24 sm:px-10 lg:px-12 lg:py-32">
  <div class="mx-auto max-w-7xl">
    <div class="mb-14 grid items-end gap-6 lg:grid-cols-[1.1fr_0.9fr]">
      <div>
        <p class="mb-5 text-xs font-semibold uppercase tracking-[0.28em] text-brand-primary">01 / Qué puedo crear</p>
        <h2 class="font-editorial text-5xl leading-[0.95] tracking-tight text-brand-dark sm:text-6xl lg:text-7xl">
          Ideas que toman <em class="font-display font-normal text-brand-primary">forma digital.</em>
        </h2>
      </div>
      <p class="max-w-lg text-base leading-8 text-brand-dark/75 lg:ml-auto lg:text-lg">
        Cada proyecto es una oportunidad de crear algo útil, intuitivo y visualmente memorable.
        Estas son las áreas en las que puedo aportar valor.
      </p>
    </div>
    <div class="grid gap-5 lg:grid-cols-3">
      <article *ngFor="let service of services" class="group relative flex min-h-80 flex-col justify-between overflow-hidden rounded-2xl border border-brand-dark/15 bg-white/50 p-7 transition duration-300 hover:-translate-y-1 hover:border-brand-gold hover:bg-white/75 hover:shadow-lg hover:shadow-brand-dark/10 sm:p-9">
        <div class="flex items-start justify-between">
          <span class="font-editorial text-2xl text-brand-primary">{{service.number}}</span>
          <span class="flex h-12 w-12 items-center justify-center rounded-full border border-brand-gold/50 text-xl text-brand-primary">
            <i class="fa-solid {{service.icon}}" aria-hidden="true"></i>
          </span>
        </div>
        <div class="mt-12">
          <h3 class="font-editorial text-4xl font-semibold leading-none text-brand-dark">{{service.title}}</h3>
          <p class="mt-4 text-sm leading-7 text-brand-dark/75 sm:text-base">{{service.description}}</p>
          <div class="mt-7 flex items-center gap-3 border-t border-brand-dark/15 pt-5 text-xs font-medium text-brand-primary">
            <span>{{service.detail}}</span>
            <i class="fa-solid fa-arrow-up-right-from-square ml-auto" aria-hidden="true"></i>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
